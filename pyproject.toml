[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banditforge"
version = "0.1.0"
description = "World-class contextual-bandit toolkit: calibrated LinUCB (BanditFuse) with zero alpha tuning, pure NumPy, deterministic, CPU-only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星", email = "CJX0712@users.noreply.github.com" }]
keywords = ["bandit", "reinforcement-learning", "online-learning", "linucb", "thompson-sampling", "contextual-bandit"]

dependencies = ["numpy>=1.26,<3"]

[project.urls]
Homepage = "https://github.com/CJX0712/banditforge"
Repository = "https://github.com/CJX0712/banditforge"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-W ignore::UserWarning"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
